<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>星环终端 · QQ 家庭助手</title>
<style>
  :root {
    --bg: #0a0a0c; --bg-deep: #060608;
    --surface: #111115; --surface-raised: #17171c;
    --line: rgba(255,255,255,.075); --line-strong: rgba(232,201,142,.32);
    --gold: #e5c68d; --gold-bright: #f8ebce;
    --ice: #8db8c6; --mint: #86b5a0; --danger: #ff8b8b;
    --text: #f2f5f8; --muted: #92a0af; --faint: #5e6b79;
    --radius: 14px;
    --font: "PingFang SC", "Microsoft YaHei", "Noto Sans SC", "Segoe UI", sans-serif;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body { margin:0; background:var(--bg); color:var(--text); font-family:var(--font); font-size:14px; line-height:1.65; }
  a { color: inherit; text-decoration: none; }
  header.topbar {
    position: sticky; top: 0; z-index: 50;
    display:flex; align-items:center; gap:18px; flex-wrap:wrap;
    padding:14px 26px;
    background: rgba(10,10,12,.86); backdrop-filter: blur(12px);
    border-bottom:1px solid var(--line);
  }
  .brand { display:flex; flex-direction:column; line-height:1.2; }
  .brand b { font-size:15px; letter-spacing:.08em; color:var(--gold-bright); font-weight:600; }
  .brand span { font-size:10px; letter-spacing:.22em; color:var(--faint); }
  nav { display:flex; gap:4px; margin-left:12px; }
  nav a { padding:6px 12px; border-radius:999px; font-size:13px; color:var(--muted); }
  nav a:hover { color:var(--gold-bright); background:rgba(232,201,142,.08); }
  .spacer { flex:1; }
  .who { font-size:12px; color:var(--muted); }
  .who b { color:var(--gold); font-weight:600; }
  main { max-width:1200px; margin:0 auto; padding:26px 26px 90px; }
  section { scroll-margin-top: 84px; margin-bottom:34px; }
  section h2 { margin:0 0 4px; font-size:20px; font-weight:600; letter-spacing:.04em; color:var(--gold-bright); }
  section .lead { margin:0 0 16px; color:var(--faint); font-size:12px; letter-spacing:.04em; }
  .grid { display:grid; gap:14px; }
  .grid.cards { grid-template-columns:repeat(auto-fit,minmax(170px,1fr)); }
  .grid.members { grid-template-columns:repeat(auto-fit,minmax(280px,1fr)); }
  .card { background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:16px 18px; }
  .card:hover { border-color:var(--line-strong); }
  .stat b { display:block; font-size:26px; color:var(--gold); font-weight:600; }
  .stat span { font-size:12px; color:var(--muted); }
  .pill { display:inline-block; font-size:11px; padding:1px 9px; border-radius:999px; border:1px solid var(--line); color:var(--muted); }
  .pill.ok { color:var(--mint); border-color:rgba(134,181,160,.4); }
  .pill.warn { color:var(--gold); border-color:var(--line-strong); }
  .pill.bad { color:var(--danger); border-color:rgba(255,139,139,.4); }
  .list { background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); overflow:hidden; }
  .row { display:flex; gap:12px; align-items:flex-start; padding:11px 16px; border-bottom:1px solid var(--line); font-size:13px; }
  .row:last-child { border-bottom:0; }
  .row .who-name { color:var(--muted); min-width:88px; }
  .row .body { flex:1; word-break:break-word; }
  .row .time { color:var(--faint); font-size:11px; white-space:nowrap; }
  .member h3 { margin:0 0 2px; font-size:16px; font-weight:600; color:var(--gold-bright); display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .member .meta { color:var(--muted); font-size:12px; margin-bottom:10px; }
  .member .controls { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-top:10px; }
  .empty { color:var(--faint); font-size:13px; padding:14px 16px; }
  .error { background:rgba(255,139,139,.08); border:1px solid rgba(255,139,139,.35); color:var(--danger); border-radius:12px; padding:10px 14px; margin-bottom:18px; display:none; }
  .error.show { display:block; }
  .admin-form { display:flex; gap:8px; flex-wrap:wrap; margin-top:12px; }
  input[type=text], input[type=time], select { background:var(--bg-deep); border:1px solid var(--line); color:var(--text); border-radius:9px; padding:7px 11px; font-size:13px; font-family:inherit; }
  button { background:var(--surface-raised); color:var(--text); border:1px solid var(--line); border-radius:9px; padding:7px 14px; cursor:pointer; font-size:13px; font-family:inherit; }
  button:hover { border-color:var(--line-strong); color:var(--gold-bright); }
  button.primary { border-color:var(--line-strong); color:var(--gold); }
  button.danger { color:var(--danger); }
  .chk { display:inline-flex; align-items:center; gap:5px; font-size:12px; color:var(--muted); }
  .muted { color:var(--faint); }
  @media (max-width: 720px) { nav { width:100%; overflow-x:auto; margin-left:0; } main { padding:20px 16px 70px; } }
</style>
</head>
<body>
<header class="topbar">
  <span class="brand"><b>星环终端</b><span>XINGHUAN TERMINAL</span></span>
  <nav>
    <a href="#home">家里</a>
    <a href="#family">家人</a>
    <a href="#chat">对话</a>
    <a href="#box">盒子</a>
    <a href="#admin" id="navAdmin" hidden>管理员</a>
  </nav>
  <span class="spacer"></span>
  <span class="who" id="whoami">未登录</span>
  <button id="refresh">刷新</button>
  <button onclick="location.href='/'">返回网站</button>
</header>

<main>
  <div class="error" id="err"></div>

  <section id="home">
    <h2>家里</h2>
    <p class="lead">QQ 消息、绑定成员、盒子留言与告警</p>
    <div class="grid cards" id="stats"></div>
    <div style="height:14px"></div>
    <div class="list" id="timeline"><div class="empty">暂无动态</div></div>
  </section>

  <section id="family">
    <h2>家人</h2>
    <p class="lead">已经用 QQ 绑定到星环账号的成员；可以设置身份和每日问候时间</p>
    <div class="grid members" id="members"><div class="empty">还没有 QQ 成员绑定</div></div>
  </section>

  <section id="chat">
    <h2>对话</h2>
    <p class="lead">QQ 群里/私聊的消息与网站对话</p>
    <div style="display:flex;gap:8px;align-items:center;margin-bottom:10px">
      <select id="chatFilter">
        <option value="">全部来源</option>
        <option value="qq">只看 QQ</option>
        <option value="site">只看网站</option>
      </select>
      <span class="muted" id="chatCount"></span>
    </div>
    <div class="list" id="chatList"><div class="empty">暂无对话</div></div>
  </section>

  <section id="box">
    <h2>盒子</h2>
    <p class="lead">给被监护者的音箱留言；盒子告警也在这里</p>
    <div class="admin-form" style="margin:0 0 12px">
      <input type="text" id="boxText" placeholder="跟妈说：记得吃药" style="flex:1;min-width:240px" />
      <button class="primary" id="boxSend">发送到盒子</button>
    </div>
    <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(300px,1fr))">
      <div>
        <h3 class="muted" style="font-size:13px;margin:0 0 8px">留言记录</h3>
        <div class="list" id="boxMessages"><div class="empty">暂无</div></div>
      </div>
      <div>
        <h3 class="muted" style="font-size:13px;margin:0 0 8px">告警</h3>
        <div class="list" id="boxAlerts"><div class="empty">暂无</div></div>
      </div>
    </div>
  </section>

  <section id="admin" hidden>
    <h2>管理员与查看权限</h2>
    <p class="lead">仅超级管理员可见</p>
    <div class="list" id="adminList"><div class="empty">加载中…</div></div>
    <div class="admin-form">
      <input type="text" id="newUsername" placeholder="账号（username）" />
      <input type="text" id="newName" placeholder="姓名（可选）" />
      <label class="chk"><input type="checkbox" class="addScope" value="messages" checked /> 对话</label>
      <label class="chk"><input type="checkbox" class="addScope" value="bindings" checked /> 家人</label>
      <button class="primary" id="addAdmin">添加管理员</button>
    </div>
  </section>
</main>

<script>
(function () {
  var API = (window.XINGHUAN_BIND_API || 'https://cloud1-d6gagyei397d315ca-1521583267.ap-shanghai.app.tcloudbase.com/qqBind').replace(/\/+$/, '');
  var token = '';
  try { token = localStorage.getItem('hub_token') || ''; } catch (e) {}
  var state = { data: null };
  var SCOPE_LABEL = { messages: '对话', bindings: '家人' };

  function el(tag, cls, text) {
    var node = document.createElement(tag);
    if (cls) node.className = cls;
    if (text != null) node.textContent = text;
    return node;
  }
  function fmt(ts) {
    if (!ts) return '';
    var d = new Date(ts);
    return isNaN(d) ? '' : d.toLocaleString('zh-CN', { month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', hour12: false });
  }
  function showError(msg) {
    var box = document.getElementById('err');
    box.textContent = msg;
    box.classList.add('show');
  }
  function clearError() { document.getElementById('err').classList.remove('show'); }
  function setText(id, text) { var n = document.getElementById(id); if (n) n.textContent = text; }

  async function api(path, body) {
    var response = await fetch(API + path, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(Object.assign({ token: token }, body || {}))
    });
    return response.json();
  }

  function renderStats() {
    var data = state.data || {};
    var messages = data.messages || [];
    var bindings = data.bindings || [];
    var box = data.box_messages || [];
    var alerts = data.box_alerts || [];
    var today = new Date().toDateString();
    var todayCount = messages.filter(function (m) { return new Date(m.ts).toDateString() === today; }).length;
    var pending = box.filter(function (b) { return b.status === 'pending' || b.status === 'processing'; }).length;
    var items = [
      [messages.length, '消息总数'],
      [todayCount, '今日消息'],
      [bindings.length, '已绑定家人'],
      [pending, '待播报留言'],
      [alerts.length, '盒子告警']
    ];
    var boxEl = document.getElementById('stats');
    boxEl.innerHTML = '';
    items.forEach(function (item) {
      var card = el('div', 'card stat');
      card.appendChild(el('b', null, String(item[0])));
      card.appendChild(el('span', null, item[1]));
      boxEl.appendChild(card);
    });
  }

  function renderTimeline() {
    var data = state.data || {};
    var box = document.getElementById('timeline');
    box.innerHTML = '';
    var rows = (data.messages || []).slice(-8).reverse();
    if (!rows.length) { box.appendChild(el('div', 'empty', '暂无动态')); return; }
    rows.forEach(function (row) {
      var line = el('div', 'row');
      line.appendChild(el('span', 'pill ' + (row.source === 'qq' ? 'warn' : ''), row.source === 'qq' ? 'QQ' : '网站'));
      line.appendChild(el('span', 'body', (row.account || row.user_key || '') + '：' + (row.role === 'assistant' ? '助手回复 · ' : '') + (row.content || '')));
      line.appendChild(el('span', 'time', fmt(row.ts)));
      box.appendChild(line);
    });
  }

  function renderMembers() {
    var data = state.data || {};
    var box = document.getElementById('members');
    box.innerHTML = '';
    var bindings = data.bindings || [];
    if (!bindings.length) {
      box.appendChild(el('div', 'empty', '还没有 QQ 成员绑定：让家人在 QQ 私聊机器人发 /绑定 验证码 即可'));
      return;
    }
    bindings.forEach(function (row) {
      var card = el('div', 'card member');
      var title = el('h3', null, row.nickname || '家人');
      title.appendChild(el('span', 'pill ' + (row.role === 'child' ? 'ok' : 'warn'), row.role === 'child' ? '监护者' : '被监护者'));
      card.appendChild(title);
      card.appendChild(el('div', 'meta', row.openid_mask + ' · 绑定于 ' + fmt(row.bound_at)));

      var controls = el('div', 'controls');
      var role = document.createElement('select');
      role.innerHTML = '<option value="elder">被监护者</option><option value="child">监护者</option>';
      role.value = row.role || 'elder';
      var daily = document.createElement('label');
      daily.className = 'chk';
      var dailyCheck = document.createElement('input');
      dailyCheck.type = 'checkbox';
      dailyCheck.checked = Boolean(row.dailyEnabled);
      daily.appendChild(dailyCheck);
      daily.appendChild(document.createTextNode(' 每日问候'));
      var time = document.createElement('input');
      time.type = 'time';
      time.value = row.dailyTime || '08:30';
      var save = el('button', 'primary', '保存');
      save.onclick = async function () {
        var result = await api('/family/member/save', {
          id: row.id, role: role.value, dailyEnabled: dailyCheck.checked, dailyTime: time.value
        });
        if (result && result.code === 0) loadData(); else showError((result && result.message) || '保存失败');
      };
      controls.appendChild(role);
      controls.appendChild(daily);
      controls.appendChild(time);
      controls.appendChild(save);
      card.appendChild(controls);
      box.appendChild(card);
    });
  }

  function renderChat() {
    var data = state.data || {};
    var filter = document.getElementById('chatFilter').value;
    var box = document.getElementById('chatList');
    box.innerHTML = '';
    var rows = (data.messages || []).filter(function (row) { return !filter || row.source === filter; });
    setText('chatCount', rows.length ? rows.length + ' 条' : '');
    if (!rows.length) { box.appendChild(el('div', 'empty', '暂无对话')); return; }
    rows.slice(-120).forEach(function (row) {
      var line = el('div', 'row');
      line.appendChild(el('span', 'pill ' + (row.source === 'qq' ? 'warn' : ''), row.source === 'qq' ? 'QQ' : '网站'));
      line.appendChild(el('span', 'who-name', row.account || row.user_key || ''));
      line.appendChild(el('span', 'body', (row.role === 'assistant' ? '助手：' : '') + (row.content || '')));
      line.appendChild(el('span', 'time', fmt(row.ts)));
      box.appendChild(line);
    });
  }

  function renderBox() {
    var data = state.data || {};
    var box = document.getElementById('boxMessages');
    box.innerHTML = '';
    var rows = (data.box_messages || []).slice().reverse();
    if (!rows.length) box.appendChild(el('div', 'empty', '暂无留言'));
    rows.forEach(function (row) {
      var line = el('div', 'row');
      line.appendChild(el('span', 'who-name', row.account || '网站'));
      line.appendChild(el('span', 'body', row.text || ''));
      var status = row.status === 'done' ? '已播报' : (row.status === 'error' ? '失败' : '排队');
      line.appendChild(el('span', 'pill ' + (row.status === 'done' ? 'ok' : (row.status === 'error' ? 'bad' : 'warn')), status));
      line.appendChild(el('span', 'time', fmt(row.created_at)));
      box.appendChild(line);
    });

    var alerts = document.getElementById('boxAlerts');
    alerts.innerHTML = '';
    var list = (data.box_alerts || []).slice(0, 15);
    if (!list.length) alerts.appendChild(el('div', 'empty', '暂无告警'));
    list.forEach(function (row) {
      var line = el('div', 'row');
      line.appendChild(el('span', 'pill ' + (row.level === 'danger' ? 'bad' : 'warn'), row.level === 'danger' ? '危险' : '提醒'));
      line.appendChild(el('span', 'body', row.text || ''));
      line.appendChild(el('span', 'time', fmt(row.created_at)));
      alerts.appendChild(line);
    });
  }

  async function loadData() {
    try {
      var payload = await api('/console/data');
      if (!payload || payload.code !== 0) { showError((payload && payload.message) || '加载失败'); return; }
      clearError();
      state.data = payload.data || {};
      var who = document.getElementById('whoami');
      who.innerHTML = '';
      who.appendChild(el('b', null, state.data.name || ''));
      who.appendChild(document.createTextNode(' · ' + (state.data.level === 'owner' ? '超级管理员' : '管理员')));
      renderStats();
      renderTimeline();
      renderMembers();
      renderChat();
      renderBox();
    } catch (e) {
      showError('连接失败：' + (e.message || e));
    }
  }

  async function loadAdmins() {
    var payload = await api('/console/admins');
    var box = document.getElementById('adminList');
    box.innerHTML = '';
    if (!payload || payload.code !== 0) { box.appendChild(el('div', 'empty', (payload && payload.message) || '无权限')); return; }
    var admins = (payload.data && payload.data.admins) || [];
    if (!admins.length) box.appendChild(el('div', 'empty', '还没有额外管理员'));
    admins.forEach(function (admin) {
      var row = el('div', 'row');
      row.appendChild(el('span', 'who-name', admin.name || admin.username || ''));
      var scopes = el('span', 'body', '');
      ['messages', 'bindings'].forEach(function (scope) {
        var label = el('label', 'chk');
        var input = document.createElement('input');
        input.type = 'checkbox';
        input.checked = (admin.scopes || []).indexOf(scope) >= 0;
        input.dataset.scope = scope;
        label.appendChild(input);
        label.appendChild(document.createTextNode(' ' + (SCOPE_LABEL[scope] || scope) + ' '));
        scopes.appendChild(label);
      });
      row.appendChild(scopes);
      var save = el('button', null, '保存');
      save.onclick = async function () {
        var selected = Array.prototype.filter.call(scopes.querySelectorAll('input[data-scope]'), function (i) { return i.checked; })
          .map(function (i) { return i.dataset.scope; });
        var r = await api('/console/admins/save', { action: 'update', id: admin.id, scopes: selected });
        if (r && r.code === 0) loadAdmins(); else showError(r && r.message);
      };
      var remove = el('button', 'danger', '删除');
      remove.onclick = async function () {
        if (!confirm('删除该管理员？')) return;
        var r = await api('/console/admins/save', { action: 'remove', id: admin.id });
        if (r && r.code === 0) loadAdmins(); else showError(r && r.message);
      };
      row.appendChild(save);
      row.appendChild(remove);
      box.appendChild(row);
    });
  }

  document.getElementById('refresh').onclick = loadData;
  document.getElementById('chatFilter').onchange = renderChat;
  document.getElementById('boxSend').onclick = async function () {
    var input = document.getElementById('boxText');
    var text = input.value.trim();
    if (!text) { showError('请输入留言内容'); return; }
    var r = await api('/box/send', { text: text });
    if (r && r.code === 0) { input.value = ''; setTimeout(loadData, 800); }
    else showError((r && r.message) || '发送失败');
  };
  document.getElementById('addAdmin').onclick = async function () {
    var username = document.getElementById('newUsername').value.trim();
    var name = document.getElementById('newName').value.trim();
    var scopes = Array.prototype.filter.call(document.querySelectorAll('.addScope'), function (i) { return i.checked; })
      .map(function (i) { return i.value; });
    if (!username && !name) { showError('请填写账号或姓名'); return; }
    var r = await api('/console/admins/save', { action: 'add', username: username, name: name, scopes: scopes });
    if (r && r.code === 0) {
      document.getElementById('newUsername').value = '';
      document.getElementById('newName').value = '';
      loadAdmins();
    } else showError((r && r.message) || '添加失败');
  };

  async function boot() {
    if (!token) { showError('未登录：请先回到网站登录，再打开本页。'); return; }
    try {
      var me = await api('/console/me');
      if (!me || me.code !== 0) { showError((me && me.message) || '需要管理员权限'); return; }
      if (me.data.level === 'owner') {
        document.getElementById('navAdmin').hidden = false;
        document.getElementById('admin').hidden = false;
        loadAdmins();
      }
      loadData();
    } catch (e) {
      showError('连接失败：' + (e.message || e));
    }
  }

  boot();
  setInterval(loadData, 15000);
})();
</script>
</body>
</html>
